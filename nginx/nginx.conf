# Main nginx configuration for the VPN-fronting web server.
# Mounted read-only into the container; per-vhost lives in conf.d/default.conf
# (rendered from default.conf.template by scripts/render-configs.sh).

# Do not advertise nginx version in error pages / Server header.
server_tokens off;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Neutral access log: no query strings, no headers — avoids leaking any
    # client-identifying data into logs. ($request is intentionally omitted.)
    log_format  neutral  '$remote_addr - $time_iso8601 "$request_method $uri" '
                         '$status $body_bytes_sent';
    access_log  /var/log/nginx/access.log  neutral;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 8m;

    # WebSocket upgrade map: "close" only when the client really asked to
    # upgrade; plain requests get a normal proxied connection.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
