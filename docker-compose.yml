# =============================================================================
# VPN/proxy stack: Nginx (TLS + fallback site) + Xray-core (VLESS over WS)
#                   + Certbot (Let's Encrypt, run-once per invocation)
#
# Design decisions (see README.md):
#   * Only 80/443 are published. Xray listens inside the docker network only.
#   * All configuration lives on the host (bind mounts), nothing is baked
#     into images. Secrets are generated by scripts/generate-secrets.sh and
#     stored in .env / xray/users.json (both gitignored).
#   * Images are pinned by digest via .env variables (XRAY_IMAGE, NGINX_IMAGE,
#     CERTBOT_IMAGE) so updates are explicit and controlled by update.sh.
#   * certbot uses the webroot method against the shared acme-web volume,
#     therefore it does NOT need to stop nginx and does NOT need docker.sock.
# =============================================================================

name: vpn-docker

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: vpn-nginx
    restart: unless-stopped
    depends_on:
      xray:
        condition: service_started
    networks: [frontend]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Main nginx config (static, no secrets)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Rendered vhost (scripts/render-configs.sh fills in DOMAIN/HIDDEN_PATH)
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Fallback static website
      - ./nginx/html:/usr/share/nginx/html:ro
      # TLS material rendered from templates (certs come from `certonly` below)
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # ACME webroot shared with certbot
      - acme-web:/var/www/acme
    healthcheck:
      # Local plain-HTTP probe of the hidden path inside the container:
      # 101 = websocket handshake OK, 400/405 = reached xray but request was
      # not a proper handshake -> both prove the proxy chain works.
      test: ["CMD-SHELL", "code=$(wget -qO /dev/null -S --header='Connection: Upgrade' --header='Upgrade: websocket' -T 5 http://127.0.0.1${HIDDEN_PATH} 2>&1 | awk '/^  HTTP/{print $2}' | tail -1); [ \"$code\" = 101 ] || [ \"$code\" = 400 ] || [ \"$code\" = 405 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  xray:
    image: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:1.8.23}
    container_name: vpn-xray
    restart: unless-stopped
    networks: [frontend]
    expose:
      - "10000"            # internal only — never published to the host
    cap_drop: [ALL]        # non-root user, no capabilities needed
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./xray/config.json:/usr/local/etc/xray/config.json:ro
    healthcheck:
      # `/mnt/logs` is the access-log location defined in config.json;
      # if xray cannot write there, the process is broken. Cheap and rootless.
      test: ["CMD-SHELL", "test -f /mnt/logs/access.log"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # One-shot helper: obtains/renews certificates, then exits.
  # Driven by install.sh and certbot/renew-hook.sh (cron). Never left running.
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v3.1.0}
    container_name: vpn-certbot
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 3600"]
    volumes:
      - certbot-www:/var/www/acme
      - certbot-conf:/etc/letsencrypt
      - certbot-logs:/var/log/letsencrypt
      - ./certbot/renew-hook.sh:/usr/local/bin/renew-hook.sh:ro
    logging: *default-logging

networks:
  frontend:
    name: ${NETWORK_NAME:-vpn-frontend}
    driver: bridge

volumes:
  certbot-www:
  certbot-conf:
  certbot-logs:
  acme-web:
